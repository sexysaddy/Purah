# Hyprland 0.50+ hyprlang form. Put these AFTER any catch-all layer blur rules.
# The overlay is transparent outside the HUD; ignore pixels with alpha <= 0.08.
layerrule = blur on, ignore_alpha 0.08, match:namespace ^purah-overlay$
layerrule = blurpopups off, match:namespace ^purah-overlay$
layerrule = no_anim on, match:namespace ^purah-overlay$
